<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>프로모션 빌더</title>
    <link rel="stylesheet" href="design-tokens.css?v=app-tokens-v1" />
    <link rel="stylesheet" href="app-shell.css?v=app-shell-sidebar-v4" />
    <link rel="stylesheet" href="app-components.css?v=app-components-v1" />
    <link rel="stylesheet" href="create-promo.css?v=create-promo-overview-v1" />
    <script src="vendor/lucide/lucide.min.js?v=1.8.0"></script>
    <script src="/prototype/i18n-runtime.js?v=i18n-runtime-v1"></script>
    <script src="shared-shell.js?v=app-shell-sidebar-v4"></script>
  </head>
  <body data-promo-flow="create-promo">
    <div class="shell-frame" data-shell-frame>
      <aside class="shell-sidebar" id="global-navigation" data-shell-sidebar aria-label="전역 내비게이션">
        <button class="shell-sidebar__close" type="button" data-shell-sidebar-close aria-label="메뉴 닫기">닫기</button>
        <div class="shell-sidebar__brand">
          <span class="shell-sidebar__brand-mark" aria-hidden="true"><i data-lucide="panels-top-left"></i></span>
          <span class="shell-sidebar__brand-copy"><strong>PROMO WEB<br />BUILDER</strong><span>Workspace</span></span>
        </div>
        <div class="shell-sidebar__mode" role="group" aria-label="사이드바 표시 방식">
          <button type="button" data-shell-sidebar-mode="min" aria-label="사이드바 최소화" title="최소"><i data-lucide="panel-left-close" aria-hidden="true"></i><span>최소</span></button>
          <button type="button" data-shell-sidebar-mode="max" aria-label="사이드바 최대화" title="최대"><i data-lucide="panel-left-open" aria-hidden="true"></i><span>최대</span></button>
        </div>
        <nav class="shell-nav shell-nav--vertical" aria-label="프로토타입 내비게이션" data-shell-nav data-shell-active="create-promo"></nav>
        <div class="shell-sidebar__footer">
          <button class="shell-theme-toggle" type="button" data-shell-theme-toggle>
            <i data-lucide="sun-moon" aria-hidden="true"></i>
            <strong data-shell-theme-label>Light</strong>
          </button>
        </div>
      </aside>
      <div class="shell-main">
        <header class="shell-utility-bar">
          <div class="shell-page-identity">
            <button class="shell-menu-toggle" type="button" data-shell-menu-toggle aria-controls="global-navigation" aria-expanded="false" aria-label="메뉴 열기">메뉴</button>
            <strong>프로모션 빌더</strong>
          </div>
          <div class="shell-page-actions"><div class="shell-status" id="wizard-shell-status" role="status">Step 1 / 4</div></div>
        </header>
        <main class="workspace shell-content">

      <section class="wizard-progress" aria-label="Create Promo steps">
        <button class="step is-active" type="button" data-step="overview">
          <span>1</span>
          <strong>Overview</strong>
        </button>
        <button class="step" type="button" data-step="template">
          <span>2</span>
          <strong>Template</strong>
        </button>
        <button class="step" type="button" data-step="layout">
          <span>3</span>
          <strong>Layout &amp; Design</strong>
        </button>
        <button class="step" type="button" data-step="output">
          <span>4</span>
          <strong>Web Output</strong>
        </button>
      </section>

      <section class="wizard-panel" id="wizard-panel" aria-live="polite">
        <div class="placeholder-grid" id="step-placeholders"></div>
      </section>

      <footer class="wizard-footer">
        <button class="secondary-action" type="button" id="prev-step">Previous</button>
        <span id="step-status">Step 1 / 4</span>
        <button class="primary-action" type="button" id="next-step">Next</button>
      </footer>
        </main>
      </div>
      <button class="shell-overlay" type="button" data-shell-overlay aria-label="메뉴 닫기"></button>
    </div>

    <script src="wizard/wizard-core.js?v=wizard-core-v2"></script>
    <script src="wizard/wizard-flow.js?v=wizard-flow-v3"></script>
    <script src="wizard/wizard-template-service.js?v=wizard-template-service-v1"></script>
    <script src="wizard/wizard-content.js?v=wizard-content-v3"></script>
    <script src="wizard/promotion-overview.js?v=promotion-overview-v1"></script>
    <script src="wizard/editor-snapshot-contract.js?v=editor-snapshot-contract-v1"></script>
    <script src="wizard/editor-bridge.js?v=editor-bridge-v1"></script>
    <script src="wizard/wizard-storage.js?v=wizard-storage-v2"></script>
    <script src="create-promo-layout-cache.js?v=create-promo-light-v28"></script>
    <script src="create-promo.js?v=create-promo-light-v36"></script>
  </body>
</html>
