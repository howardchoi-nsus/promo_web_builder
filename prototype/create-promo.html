<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Promo</title>
    <link rel="stylesheet" href="shared-shell-header.css?v=create-promo-appearance-v20" />
    <link rel="stylesheet" href="create-promo.css?v=create-promo-appearance-v20" />
    <script src="shared-shell.js?v=create-promo-appearance-v20"></script>
  </head>
  <body data-promo-flow="create-promo">
    <main class="wizard-shell">
      <header class="shell-header">
        <div class="shell-header__identity">
          <div class="shell-header__brand-row">
            <h1 class="shell-header__brand">PROMO WEB BUILDER</h1>
            <span class="shell-header__page-label">Create Promo</span>
          </div>
        </div>
        <div class="shell-header__actions">
          <nav class="shell-nav" aria-label="프로토타입 내비게이션">
            <a href="/prototype/index.html">프로모션 빌더</a>
            <a href="/prototype/index.html?view=admin&amp;tab=promo-form">관리자 페이지</a>
            <a href="/promo-wizard.html">Promo Wizard</a>
            <a class="active" href="/create-promo.html" aria-current="page">Create Promo</a>
            <a href="/prototype/visual-editor.html">Visual Editor</a>
            <a href="/prototype/generated.html">생성된 UI</a>
          </nav>
          <button class="shell-theme-toggle" type="button" data-shell-theme-toggle>
            <span class="shell-theme-dot" aria-hidden="true"></span>
            <strong data-shell-theme-label>Light</strong>
          </button>
          <div class="shell-status" id="wizard-shell-status" role="status">Step 1 / 4</div>
        </div>
      </header>

      <section class="wizard-progress" aria-label="Create Promo steps">
        <button class="step is-active" type="button" data-step="1">
          <span>1</span>
          <strong>Background</strong>
        </button>
        <button class="step" type="button" data-step="2">
          <span>2</span>
          <strong>CTA Style</strong>
        </button>
        <button class="step" type="button" data-step="3">
          <span>3</span>
          <strong>Template &amp; Content</strong>
        </button>
        <button class="step" type="button" data-step="4">
          <span>4</span>
          <strong>Web Output</strong>
        </button>
      </section>

      <section class="wizard-panel" id="wizard-panel" aria-live="polite">
        <div class="step-title">
          <p class="eyebrow" id="step-eyebrow">Step 1</p>
          <h2 id="step-title">배경색 선택</h2>
          <p id="step-copy">
            프로모션의 기본 배경색을 고르세요. 선택 결과는 미리보기에 즉시 반영됩니다.
          </p>
        </div>
        <div class="placeholder-grid" id="step-placeholders"></div>
      </section>

      <footer class="wizard-footer">
        <button class="secondary-action" type="button" id="prev-step">Previous</button>
        <span id="step-status">Step 1 / 4</span>
        <button class="primary-action" type="button" id="next-step">Next</button>
      </footer>
    </main>

    <script src="create-promo.js?v=create-promo-appearance-v20"></script>
  </body>
</html>
