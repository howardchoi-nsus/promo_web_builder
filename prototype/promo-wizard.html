<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Promo Wizard</title>
    <link rel="stylesheet" href="design-tokens.css?v=app-tokens-v1" />
    <link rel="stylesheet" href="app-shell.css?v=app-shell-v1" />
    <link rel="stylesheet" href="promo-wizard.css?v=app-tokens-v1" />
    <script src="shared-shell.js?v=shared-shell-header-v16"></script>
  </head>
  <body>
    <main class="wizard-shell">
      <header class="shell-header">
        <div class="shell-header__identity">
          <div class="shell-header__brand-row">
            <h1 class="shell-header__brand">PROMO WEB BUILDER</h1>
            <span class="shell-header__page-label">Promo Wizard</span>
          </div>
        </div>
        <div class="shell-header__actions">
          <nav class="shell-nav" aria-label="프로토타입 내비게이션" data-shell-nav data-shell-active="promo-wizard"></nav>
          <button class="shell-theme-toggle" type="button" data-shell-theme-toggle>
            <span class="shell-theme-dot" aria-hidden="true"></span>
            <strong data-shell-theme-label>Light</strong>
          </button>
          <div class="shell-status" id="wizard-shell-status" role="status">Step 1 / 4</div>
        </div>
      </header>

      <section class="wizard-progress" aria-label="Wizard steps">
        <button class="step is-active" type="button" data-step="1">
          <span>1</span>
          <strong>Concept</strong>
        </button>
        <button class="step" type="button" data-step="2">
          <span>2</span>
          <strong>Content</strong>
        </button>
        <button class="step" type="button" data-step="3">
          <span>3</span>
          <strong>LO-FI</strong>
        </button>
        <button class="step" type="button" data-step="4">
          <span>4</span>
          <strong>Final</strong>
        </button>
      </section>

      <section class="wizard-panel" id="wizard-panel" aria-live="polite">
        <div class="step-title">
          <p class="eyebrow" id="step-eyebrow">Step 1</p>
          <h2 id="step-title">Design Concept Selection</h2>
          <p id="step-copy">
            Select the design concept that will guide the integrated brief, LO-FI draft, and final design generation.
          </p>
        </div>
        <div class="placeholder-grid" id="step-placeholders"></div>
      </section>

      <footer class="wizard-footer">
        <button class="secondary-action" type="button" id="prev-step">Previous</button>
        <span id="step-status">Step 1 / 4</span>
        <button class="primary-action" type="button" id="next-step">Next</button>
      </footer>
    </main>

    <script src="wizard/wizard-core.js?v=wizard-core-v1"></script>
    <script src="wizard/wizard-content.js?v=wizard-content-v1"></script>
    <script src="wizard/wizard-storage.js?v=wizard-storage-v1"></script>
    <script src="promo-wizard.js?v=shared-shell-header-v16"></script>
  </body>
</html>
